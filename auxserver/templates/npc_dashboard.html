<!DOCTYPE html>
<html><head>
<title>NPC Dashboard</title>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1e; color: #ccc; font-family: 'Consolas', monospace; font-size: 13px; padding: 16px; }
  h1 { color: #aa66ff; font-size: 20px; margin-bottom: 12px; }
  h2 { color: #66aaff; font-size: 14px; margin: 12px 0 6px; border-bottom: 1px solid #222; padding-bottom: 4px; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .controls label { color: #888; }
  .controls select { background: #1a1a2e; color: #ddd; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; font-family: inherit; font-size: 13px; }
  .dashboard { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 16px; align-items: start; }
  .stack { display: grid; gap: 16px; align-content: start; }
  .card { background: #111; border: 1px solid #222; border-radius: 6px; padding: 12px; }
  .stat { display: inline-block; margin: 2px 8px 2px 0; }
  .stat b { color: #aaddff; }
  .log { max-height: 300px; overflow-y: auto; }
  .log div { padding: 2px 0; border-bottom: 1px solid #1a1a1a; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; }
  .badge.running { background: #224422; color: #66ff66; }
  .badge.stopped { background: #442222; color: #ff6666; }
  .badge.idle { background: #222244; color: #aaaaff; }
  .mono { white-space: pre-wrap; font-family: 'Consolas', monospace; color: #9fb3c8; line-height: 1.35; }
  .mem-entry { padding: 3px 0; border-bottom: 1px solid #1a1a1a; }
  .mem-entry .imp { color: #666; font-size: 11px; }
  .mem-type { color: #aa88ff; font-size: 11px; }
  .diary { color: #aaccaa; padding: 4px 0; border-bottom: 1px solid #1a1a1a; }
  .diary .dtime { color: #556655; font-size: 11px; }
  .drive-bar { display: flex; align-items: center; margin: 3px 0; gap: 6px; }
  .drive-bar .label { width: 100px; color: #99aacc; }
  .drive-bar .bar-bg { flex: 1; background: #151525; border: 1px solid #26263a; border-radius: 3px; height: 10px; overflow: hidden; }
  .drive-bar .bar-fg { height: 100%; background: linear-gradient(90deg, #6644aa, #aa66ff); }
  .drive-val { width: 36px; text-align: right; color: #888; font-size: 11px; }
  .rel-entry { padding: 3px 0; }
  .rel-entry b { color: #aaddff; }
  .trust { color: #66ff88; }
  .fear { color: #ff8866; }
  .anger { color: #ff4444; }
  #status { color: #556677; font-size: 11px; margin-bottom: 8px; }
  .empty { color: #666; }
  .task-box { background: #1a1a2e; padding: 8px; border-radius: 4px; margin: 4px 0; }
  .task-box .task-name { color: #ffcc44; font-weight: bold; font-size: 15px; }
  .personality-type { color: #dd88ff; font-size: 15px; font-weight: bold; }
  @media (max-width: 1400px) { .dashboard { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 980px) { .dashboard { grid-template-columns: 1fr; } }
</style>
</head><body>
<h1>NPC Dashboard</h1>
<div class="controls">
  <label>Player: <select id="pidSelect" onchange="onPidChange()"><option value="">-- select --</option></select></label>
  <label>NPC: <select id="npcSelect" onchange="onNpcChange()"><option value="">-- select --</option></select></label>
</div>
<div id="status">Loading...</div>
<div class="dashboard">
  <div class="stack">
    <div class="card" id="stats-card"><h2>Stats</h2><div class="empty">Select a player and NPC above.</div></div>
    <div class="card" id="soul-card"><h2>Soul</h2></div>
    <div class="card" id="task-card"><h2>Current Task</h2></div>
  </div>
  <div class="stack">
    <div class="card" id="drives-card"><h2>Drives &amp; Emotions</h2></div>
    <div class="card" id="memory-card"><h2>Memories</h2></div>
  </div>
  <div class="stack">
    <div class="card" id="diary-card"><h2>Diary</h2></div>
  </div>
</div>

<script>
let selectedPid = '';
let selectedNpcId = '';
let allData = null;

async function refresh() {
  try {
    const url = '/api/npc' + (selectedPid ? '?pid=' + encodeURIComponent(selectedPid) : '');
    const r = await fetch(url);
    allData = await r.json();

    document.getElementById('status').textContent =
      `Players: ${allData.players.length} | Updated ${new Date().toLocaleTimeString()}`;

    // Rebuild player dropdown (preserve selection)
    const pidSel = document.getElementById('pidSelect');
    const curPid = pidSel.value;
    pidSel.innerHTML = '<option value="">-- select --</option>';
    for (const p of allData.players) {
      const opt = document.createElement('option');
      opt.value = p.pid;
      opt.textContent = `${p.pid} (${p.npc_count} NPC${p.npc_count !== 1 ? 's' : ''})`;
      if (p.pid === (selectedPid || curPid)) opt.selected = true;
      pidSel.appendChild(opt);
    }

    // Rebuild NPC dropdown if we have a player selected
    if (selectedPid && allData.npcs) {
      const npcSel = document.getElementById('npcSelect');
      const curNpc = npcSel.value;
      npcSel.innerHTML = '<option value="">-- select --</option>';
      for (const n of allData.npcs) {
        const opt = document.createElement('option');
        opt.value = n.id;
        opt.textContent = `${n.name} (${n.id})`;
        if (n.id === (selectedNpcId || curNpc)) opt.selected = true;
        npcSel.appendChild(opt);
      }

      // Find and render selected NPC
      const npc = allData.npcs.find(n => n.id === selectedNpcId) || allData.npcs[0];
      if (npc) {
        if (!selectedNpcId) {
          selectedNpcId = npc.id;
          document.getElementById('npcSelect').value = npc.id;
        }
        renderNpc(npc);
      }
    }
  } catch(e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
}

function onPidChange() {
  selectedPid = document.getElementById('pidSelect').value;
  selectedNpcId = '';
  document.getElementById('npcSelect').innerHTML = '<option value="">-- select --</option>';
  clearCards();
  refresh();
}

function onNpcChange() {
  selectedNpcId = document.getElementById('npcSelect').value;
  if (allData && allData.npcs) {
    const npc = allData.npcs.find(n => n.id === selectedNpcId);
    if (npc) renderNpc(npc);
  }
}

function clearCards() {
  document.getElementById('stats-card').innerHTML = '<h2>Stats</h2><div class="empty">Select an NPC.</div>';
  document.getElementById('soul-card').innerHTML = '<h2>Soul</h2>';
  document.getElementById('task-card').innerHTML = '<h2>Current Task</h2>';
  document.getElementById('drives-card').innerHTML = '<h2>Drives &amp; Emotions</h2>';
  document.getElementById('memory-card').innerHTML = '<h2>Memories</h2>';
  document.getElementById('diary-card').innerHTML = '<h2>Diary</h2>';
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderNpc(npc) {
  const s = npc.stats || {};
  const soul = npc.soul || {};
  const personality = soul.personality || {};
  const drives = soul.drives || {};
  const relationships = soul.relationships || {};
  const memories = soul.memories || {};
  const diary = soul.diary || [];
  const liveBadge = npc.live
    ? '<span class="badge running" style="margin-left:8px">LIVE</span>'
    : '<span class="badge stopped" style="margin-left:8px">DB snapshot</span>';

  // Stats
  document.getElementById('stats-card').innerHTML = `
    <h2>Stats — <span style="color:#ffaaff">${esc(npc.name)}</span>
      <span style="color:#666;font-size:11px;margin-left:8px">${esc(npc.id)}</span>
      ${liveBadge}
    </h2>
    <div class="stat"><b>HP:</b> ${s.hp ?? '?'}/${s.maxHp ?? '?'}</div>
    <div class="stat"><b>Ki:</b> ${s.ki ?? '?'}/${s.maxKi ?? '?'}</div>
    <div class="stat"><b>STR:</b> ${s.str ?? '?'}</div>
    <div class="stat"><b>DEF:</b> ${s.def ?? '?'}</div>
    <div class="stat"><b>Lv:</b> ${s.level ?? '?'}</div>
    <div class="stat"><b>XP:</b> ${s.xp ?? '?'}</div>
    <br>
    <div class="stat"><b>Pos:</b> (${s.x ?? '?'}, ${s.y ?? '?'})</div>
    <div class="stat"><b>Map:</b> ${esc(s.map ?? 'level_01')}</div>
    ${s.dead ? '<div style="color:#ff4444;margin-top:4px">DEAD</div>' : ''}
    ${s.knocked_out ? '<div style="color:#ffaa44;margin-top:4px">KNOCKED OUT</div>' : ''}`;

  // Soul / personality
  let soulHtml = '<h2>Soul</h2>';
  if (personality.type) {
    soulHtml += `<div class="personality-type">${esc(personality.type)}</div>`;
  }
  const traits = Object.entries(personality).filter(([k]) => !['type','description','phrases','learned_phrases'].includes(k));
  if (traits.length > 0) {
    soulHtml += '<div style="margin-top:6px">';
    for (const [k, v] of traits) {
      soulHtml += `<div class="stat"><b>${esc(k)}:</b> ${typeof v === 'number' ? v.toFixed(2) : esc(String(v))}</div>`;
    }
    soulHtml += '</div>';
  }
  if (personality.description) {
    soulHtml += `<div style="margin-top:6px;color:#aaa;font-style:italic">${esc(personality.description)}</div>`;
  }
  if (!personality.type && traits.length === 0) soulHtml += '<div class="empty">No soul data yet.</div>';
  document.getElementById('soul-card').innerHTML = soulHtml;

  // Current task
  let taskHtml = '<h2>Current Task</h2>';
  const task = npc.current_task || npc.background_task;
  if (task) {
    const runBadge = npc.task_running ? '<span class="badge running">running</span>' : '<span class="badge stopped">stopped</span>';
    const lockBadge = npc.manual_locked ? ' <span class="badge idle">player-locked</span>' : '';
    taskHtml += `<div class="task-box"><div class="task-name">${esc(task)} ${runBadge}${lockBadge}</div></div>`;
  } else {
    taskHtml += `<div class="empty">${npc.live ? 'No active task.' : 'Not live yet — waiting for first sync.'}</div>`;
  }

  // Last decision
  const dec = npc.last_decision;
  if (dec) {
    taskHtml += `<h2>Last Decision</h2>
      <div class="task-box">
        <div class="task-name">${esc(dec.intent)}</div>
        ${dec.reason ? `<div style="color:#88aa88;margin-top:4px">${esc(dec.reason)}</div>` : ''}
        ${dec.speech ? `<div style="color:#ffcc88;font-style:italic;margin-top:4px">"${esc(dec.speech)}"</div>` : ''}
        ${dec.confidence != null ? `<div style="color:#666;font-size:11px;margin-top:2px">confidence: ${(dec.confidence*100).toFixed(0)}%</div>` : ''}
      </div>`;
  }

  // Recent events
  const events = npc.recent_events || [];
  if (events.length > 0) {
    taskHtml += '<h2>Recent Events</h2><div class="log">';
    for (const e of events.slice().reverse()) {
      taskHtml += `<div>${esc(e)}</div>`;
    }
    taskHtml += '</div>';
  }
  document.getElementById('task-card').innerHTML = taskHtml;

  // Drives & emotions
  let drivesHtml = '<h2>Drives</h2>';
  const driveEntries = Object.entries(drives).filter(([k]) => !k.startsWith('_'));
  if (driveEntries.length > 0) {
    for (const [k, v] of driveEntries.sort((a,b) => b[1]-a[1])) {
      const pct = Math.max(0, Math.min(100, Math.round(Number(v) * 100)));
      drivesHtml += `<div class="drive-bar">
        <div class="label">${esc(k)}</div>
        <div class="bar-bg"><div class="bar-fg" style="width:${pct}%"></div></div>
        <div class="drive-val">${pct}%</div>
      </div>`;
    }
  } else {
    drivesHtml += '<div class="empty">No drive data yet.</div>';
  }

  drivesHtml += '<h2>Relationships</h2>';
  const relEntries = Object.entries(relationships);
  if (relEntries.length > 0) {
    for (const [key, rel] of relEntries) {
      const em = rel.emotions || {};
      drivesHtml += `<div class="rel-entry">
        <b>${esc(key)}</b>
        ${em.trust != null ? ' | <span class="trust">trust: ' + em.trust.toFixed(2) + '</span>' : ''}
        ${em.fear != null ? ' | <span class="fear">fear: ' + em.fear.toFixed(2) + '</span>' : ''}
        ${em.anger != null ? ' | <span class="anger">anger: ' + em.anger.toFixed(2) + '</span>' : ''}
      </div>`;
    }
  } else {
    drivesHtml += '<div class="empty">No relationships yet.</div>';
  }
  document.getElementById('drives-card').innerHTML = drivesHtml;

  // Memories
  let memHtml = '<h2>Memories</h2>';
  const memBuckets = Object.entries(memories);
  if (memBuckets.length > 0) {
    for (const [bucket, mems] of memBuckets) {
      if (!Array.isArray(mems) || mems.length === 0) continue;
      memHtml += `<div style="color:#8888cc;margin:6px 0 2px;font-size:11px">${esc(bucket)}</div>`;
      for (const m of mems.slice(-8).reverse()) {
        const text = typeof m === 'string' ? m : (m.text || JSON.stringify(m));
        const imp = m.importance != null ? m.importance.toFixed(2) : '';
        const mtype = m.type || '';
        memHtml += `<div class="mem-entry">
          ${mtype ? '<span class="mem-type">[' + esc(mtype) + ']</span> ' : ''}${esc(text)}
          ${imp ? '<span class="imp"> imp:' + imp + '</span>' : ''}
        </div>`;
      }
    }
  } else {
    memHtml += '<div class="empty">No memories yet.</div>';
  }
  document.getElementById('memory-card').innerHTML = memHtml;

  // Diary
  let diaryHtml = '<h2>Diary</h2><div class="log">';
  if (diary.length > 0) {
    for (const entry of diary.slice().reverse()) {
      const text = typeof entry === 'string' ? entry : (entry.text || JSON.stringify(entry));
      const ts = entry.time || entry.ts || '';
      diaryHtml += `<div class="diary">${ts ? '<span class="dtime">' + esc(ts) + '</span> ' : ''}${esc(text)}</div>`;
    }
  } else {
    diaryHtml += '<div class="empty">No diary entries yet.</div>';
  }
  diaryHtml += '</div>';
  document.getElementById('diary-card').innerHTML = diaryHtml;
}

refresh();
setInterval(refresh, 2000);
</script>
</body></html>
